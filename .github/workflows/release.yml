name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check that the tag matches the project version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Tuzat.App -getProperty:Version).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match version $version in Directory.Build.props" }

      - name: Test, publish and build the installer
        shell: pwsh
        run: ./build.ps1

      - name: Write checksums and release notes
        shell: pwsh
        run: |
          Get-ChildItem artifacts/Tuzat-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt

          $version = '${{ github.ref_name }}'.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[|\z)").Groups[1].Value.Trim()
          @"
          $section

          ## Install

          Download ``Tuzat-Setup-$version.exe`` below and run it. No admin rights are needed.

          The installer is not code-signed yet. If SmartScreen warns you, choose **More info → Run anyway**, and compare the file hash with ``SHA256SUMS.txt``.
          "@ | Set-Content artifacts/release-notes.md

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ('${{ github.ref_name }}' -match '^v0\.|-') { $flags += '--prerelease' }
          $installer = (Get-ChildItem artifacts/Tuzat-Setup-*.exe).FullName
          gh release create '${{ github.ref_name }}' $installer artifacts/SHA256SUMS.txt `
            --title 'Tuzat ${{ github.ref_name }}' `
            --notes-file artifacts/release-notes.md @flags
